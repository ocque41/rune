name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
